<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tracking Result | Track-it</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>📍 Tracking Details</h1>

    <p><strong>Tracking Number:</strong> <span id="trackingCode"></span></p>

    <div class="status">

      <div class="done">✔ Dispatched</div>
      <div class="done">✔ In Transit</div>
      <div class="pending">⏳ Out for Delivery</div>
      <div>⬜ Delivered</div>

    <p><strong>Current Location:</strong> Abakaliki Distribution Center</p>
    <p><strong>Estimated Delivery:</strong> 2 Days</p>

    <a href="index.html" class="back">← Track Another Package</a>

    <small class="disclaimer">
      Educational simulation only. No real shipment involved.
    </small>
  </div>

  <script src="script.js"></script>

</html>
